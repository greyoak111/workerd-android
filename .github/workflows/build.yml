name: build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: workerd 版本标签（要与 wrangler 自带的 workerd 版本一致）
        default: v1.20261012.1
permissions:
  contents: write
jobs:
  linux-arm64-no-tcmalloc:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 360
    steps:
      - name: 腾磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: 取 workerd 源码
        run: git clone --depth 1 --branch ${{ inputs.tag }} https://github.com/cloudflare/workerd.git src
      - name: 缓存
        uses: actions/cache@v4
        with:
          path: ~/bazel-disk-cache
          key: bazel-${{ inputs.tag }}-${{ github.run_id }}
          restore-keys: bazel-
      - name: 装 LLVM 22（照 workerd 官方 CI）
        working-directory: src
        run: |
          export DEBIAN_FRONTEND=noninteractive
          wget -q https://apt.llvm.org/llvm.sh
          sed -i '/apt-get install/d' llvm.sh
          chmod +x llvm.sh && sudo ./llvm.sh 22
          sudo apt-get install -y -qq --no-install-recommends clang-22 lld-22 libunwind-22-dev libc++-22-dev libclang-rt-22-dev llvm-22
          echo "build:linux --repo_env=CC=/usr/lib/llvm-22/bin/clang" >> .bazelrc
          echo "build:linux --linkopt=--ld-path=/usr/lib/llvm-22/bin/ld.lld" >> .bazelrc
          echo "build:linux --host_linkopt=--ld-path=/usr/lib/llvm-22/bin/ld.lld" >> .bazelrc
          echo "build:linux --repo_env=AR=/usr/lib/llvm-22/bin/llvm-ar" >> .bazelrc
      - name: 编译（关 tcmalloc，改用 glibc malloc）
        working-directory: src
        run: |
          bazel build --disk_cache=~/bazel-disk-cache --jobs=4 --strip=always \
            --config=release_linux \
            --@workerd//src/workerd/server:use_tcmalloc=False \
            //src/workerd/server:workerd
          mkdir -p ../out && cp bazel-bin/src/workerd/server/workerd ../out/workerd
          chmod 755 ../out/workerd
          ../out/workerd --version
          # 给 cccodroid 组件的一份：解释器改成 cccodroid 的 glibc 加载器，别的字节不动（同 cc-codroid.yml）
          sudo apt-get install -y -qq patchelf
          cp ../out/workerd ../out/workerd-cc.codroid
          patchelf --set-interpreter /data/data/cc.codroid/files/usr/glibc/lib/ld-linux-aarch64.so.1 ../out/workerd-cc.codroid
          /lib/ld-linux-aarch64.so.1 ../out/workerd-cc.codroid --version
          ( cd ../out && gzip -9k workerd && sha256sum workerd workerd.gz workerd-cc.codroid > SHA256SUMS )
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=${{ inputs.tag }}
          gh release create "$T" out/workerd out/workerd.gz out/workerd-cc.codroid out/SHA256SUMS -R ${{ github.repository }} \
            --title "workerd $T（linux-arm64，无 tcmalloc）" \
            --notes "上游 cloudflare/workerd $T，按官方 release_linux 配置编译，仅加 use_tcmalloc=False。用于安卓（39 位地址空间）经 glibc 加载器运行。" \
          || gh release upload "$T" out/workerd out/workerd.gz out/workerd-cc.codroid out/SHA256SUMS -R ${{ github.repository }} --clobber
